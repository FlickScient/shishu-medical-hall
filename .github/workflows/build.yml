name: Build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_COOKIE_SECRET: ci-only-build-secret-not-for-production-1234567890\n      NEON_AUTH_BASE_URL: https://ep-twilight-mountain-aogvtl0p.neonauth.c-2.ap-southeast-1.aws.neon.tech/shishu_medical_hall/auth
      NEXT_PUBLIC_NEON_AUTH_URL: https://ep-twilight-mountain-aogvtl0p.neonauth.c-2.ap-southeast-1.aws.neon.tech/shishu_medical_hall/auth
      NEON_DATA_API_URL: https://ep-twilight-mountain-aogvtl0p.apirest.c-2.ap-southeast-1.aws.neon.tech/shishu_medical_hall/rest/v1
      NEXT_PUBLIC_NEON_DATA_API_URL: https://ep-twilight-mountain-aogvtl0p.apirest.c-2.ap-southeast-1.aws.neon.tech/shishu_medical_hall/rest/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
